case_id: pll_lead_lag_integer_q1_reference

source:
  doi: 10.1109/ICUMT.2015.7382409
  title: "Limitations of PLL simulation: hidden oscillations in MatLab and SPICE"
  published_horizon: 5.0

system:
  system_id: pll-lead-lag-2015
  coordinates: "u=x-x_e; v=theta_delta-theta_focus"
  state_space: R_times_S1
  parameters:
    tau1: 0.0448
    tau2: 0.0185
    loop_gain: 500.0
    omega_delta: 178.9

direct_route:
  route: direct_integer_transfer
  fallback_route: null
  transfer_convention: standard_and_code_signs_recorded
  expected_decision: rejected_no_positive_imaginary_part_root
  frequency_scan_used: false

andronov_return:
  section: theta_delta_mod_2pi_equals_zero_positive_winding
  rtol: 2.0e-11
  atol: 2.0e-13
  max_step_angle: 0.02
  minimum_velocity: 1.0e-8
  root_tolerance: 1.0e-11
  separator_bracket_samples: 160

continuation:
  route: exact_zero_gain_running_cycle_to_target_loop_gain
  start_loop_gain: 0.0
  stop_loop_gain: 500.0
  steps: 101
  quick_steps: 21

reference_cycle:
  points: 2001
  rtol: 2.0e-12
  atol: 2.0e-14
  max_step: 2.0e-4
  return_tolerance: 1.0e-9

hiddenness:
  metric: scaled_R_times_S1
  scales:
    u: tau1_over_2
    v: pi
  radii: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]
  samples_per_radius: 12
  sampling_mode: uniform_ball_in_scaled_coordinates
  random_seed: 7382409
  t_final: 5.0
  tail_duration: 1.0
  output_step: 0.002
  max_step: 0.002
  target_cloud_tolerance: 0.01
  equilibrium_tolerance: 1.0e-5
  minimum_tail_windings: 5.0
  required_equilibrium_classes: [E_focus, E_saddle]
  expected_probe_count: 96

published_regression:
  role: post_derivation_regression_only_not_seed_input
  cases:
    - {x0: 0.0, theta0: 0.0, expected: target_cycle}
    - {x0: 0.005, theta0: 0.0, expected: target_cycle}
    - {x0: 0.00555, theta0: 0.0, expected: equilibrium_E_focus}

outputs:
  output_dir: validation/reference_cases/pll_lead_lag_integer_q1
  figures_dir: validation/reference_cases/pll_lead_lag_integer_q1/figures
