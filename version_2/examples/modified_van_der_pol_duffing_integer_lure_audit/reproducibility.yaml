  q: 1.0
  shared_parameters:
    gamma: 0.1
    delta: 100.0
    rho: 200.0
  primary:
    xi: 3.1
    role: "blind_outer_candidate_with_adaptive_periodicity_qualification"
  negative_control:
    xi: 3.5
