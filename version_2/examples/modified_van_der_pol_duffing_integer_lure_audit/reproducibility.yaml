  fallback_route: null
  method: classic
  omega_min: 1.0e-5
  omega_max: 50.0
  branch_order: [0, 1]
  seed_phases: [0.0, 3.141592653589793]
  continuation_phases: [0.0, 3.141592653589793]
  frequency_grid_used: false
  cluster_threshold: 0.06
  cluster_cloud_points: 400

continuation:
