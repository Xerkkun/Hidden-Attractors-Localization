  t_keep: 10.0
  h: 0.002
  div_threshold: 50.0

final_simulation:
  t_burn: 300.0
  t_keep: 200.0
  h: 0.005
  div_threshold: 50.0

adaptive_refinement:
  method: DOP853
  rtol: 2.0e-11
  atol: 2.0e-13
  max_step: 0.005
  sample_step: 0.005
  t_burn: 600.0
  t_keep: 1200.0
  convergence_windows: [200.0, 500.0, 1000.0]
