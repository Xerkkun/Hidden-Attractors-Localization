site_name: hidden-attractors-fo
site_description: Numerical characterization and validated hidden-attractor workflows for dynamical systems.
repo_url: https://github.com/Xerkkun/Hidden-Attractors-Localization
repo_name: Xerkkun/Hidden-Attractors-Localization
exclude_docs: |
  *.pdf
  *.aux
  *.bbl
  *.bcf
  *.bib
  *.blg
  *.fdb_latexmk
  *.fls
  *.log
  *.out
  *.run.xml
  *.tex
  *.toc
  manual_manifest.yaml
  lure_candidate_route.md
  testing_policy.md
  ecosystem_roadmap.md
  current_function_closure.md
  scispace_fractional_method_evidence.md
  upstream_function_matrix.md
  master_report_geometric_topological/**
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
nav:
  - Home: index.md
  - User Guides:
      - Installation: installation.md
      - Quick Start: quick_start.md
      - Getting Started: getting_started.md
      - Examples Index: examples_index.md
      - Examples: examples.md
      - Notebook Example: notebooks.md
      - Adapting New Systems: adapting_new_systems.md
      - Systems: systems.md
      - Workflows: workflows.md
  - Scientific Scope:
      - Scientific Scope: scientific_scope.md
      - Validation Boundary: validation_evidence.md
      - Validation Methodology: validation_methodology.md
      - Hiddenness Verification: hiddenness_verification.md
      - Geometric-Topological Campaign: geometric_topological_campaign.md
      - Integer Chua q=1 Reference: integer_chua_reference.md
      - Integer Lur'e Test Catalog: integer_lure_test_catalog.md
      - Integer Hidden-Chaos Search: integer_hidden_chaos_search.md
      - Unified Integer/Fractional Engine: fractional_integer_engine.md
      - Fractional Method Catalog: fractional_method_catalog.md
      - Variable-Order Caputo Type III: variable_order_caputo_type3.md
      - Distributed-Order Caputo L1: distributed_order_caputo_l1.md
      - Multi-Term Caputo L1: multi_term_caputo_l1.md
      - Tempered BDF Convolution Quadrature: tempered_convolution_quadrature.md
      - Fast Recurrent Tempered Multistep History: tempered_fast_multistep_history.md
      - Basin Entropy and Uncertainty: basin_uncertainty_metrics.md
      - Fractional Chua q=0.9998 Algebra: fractional_chua_algebra_validation.md
  - Dynamics and Diagnostics:
      - Mathematical Diagnostics: mathematical_diagnostics.md
      - Common Trajectory Contract: analysis_contracts.md
      - Permutation Entropy: permutation_entropy.md
      - Correlation Dimension: correlation_dimension.md
      - Reconstruction and Advanced Recurrence: trajectory_reconstruction_recurrence.md
      - Dynamical Analysis: dynamical_analysis.md
      - Poincare Diagnostics: poincare_diagnostics.md
      - Lyapunov Methods: lyapunov_methods.md
      - Integer Covariant Lyapunov Vectors: covariant_lyapunov_vectors.md
      - Integer SALI and GALI: sali_gali_integer.md
      - EFORK-3 Published Validation: efork3_validation.md
  - Figures and Reports:
      - Plotting Function Catalog: plot_function_catalog.md
      - Unified Report: unified_report.md
  - Reference:
      - API Reference: api_reference.md
      - API Stability Tiers: api_stability.md
      - Public Calculation Reference Map: code_reference_map.md
      - Testing: testing.md
      - Citation: citation.md
      - External Tools: external_tools.md
  - Development:
      - Contributing: contributing.md
      - Versioning Policy: versioning.md
      - Dependency Policy: dependency_policy.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
