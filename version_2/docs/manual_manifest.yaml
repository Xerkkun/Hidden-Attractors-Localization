manual_version: "1.1.0"
package_version: "1.1.0"

public_cli: "hidden-attractors"
entry_point: "hidden_attractors.cli.main:main"

manual_targets:
  user_manual: "USER_MANUAL.md"
  documentation_root: "docs/"

scientific_scope:
  public_uses:
    - "hidden-attractor localization for compatible systems"
    - "independent dynamical-system, trajectory, and time-series characterization"
  evidence_boundary: "finite-data and finite-time numerical results under recorded method settings"
  hiddenness_boundary: "sampled-neighborhood evidence is not a global mathematical proof"

publication_boundary:
  pypi_distribution: "supported software, public examples, and public user documentation"
  validation_records: "release-tagged validation tree, excluded from PyPI distributions"
  detailed_reports: "local editorial artifacts, excluded from the public documentation site"

documentation_policy:
  public_content: "supported interfaces, completed validations, and explicit numerical limitations"
  excluded_content: "local campaigns, editorial working files, private research notes, and forward-looking plans"
  version_source: "pyproject.toml"
