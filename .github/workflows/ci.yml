# CI mínimo – hidden-attractors-fo
# Ejecuta smoke checks de sintaxis, pruebas unitarias y ejemplos de usuario.
#
# Matriz OS automática
# --------------------
# ubuntu-latest : smoke tests, pytest, C11 estricto y ASan/UBSan nativo.
# windows-latest: smoke tests, pytest y ejemplos de usuario.
# macos-latest  : smoke tests, pytest y ejemplos de usuario.
#
# El gate nativo obligatorio de Linux vive en `cc-probe`; Windows conserva un
# smoke best-effort cuando gcc está disponible. La corrida macOS con
# `brew install libomp` queda en `ci-macos`, disparable manualmente.
#
# Backends C
# ----------
# Linux compila todas las fuentes C mantenidas con warnings estrictos tratados
# como errores y ejecuta un arnés ABI bajo AddressSanitizer/UBSan. Windows
# compila y prueba los wrappers si el runner ofrece gcc; macOS queda manual.
#
# Variables de entorno
# --------------------
# ALLOW_NO_OPENMP=1  – permite que compile_c_target continúe sin OpenMP en
#                      lugar de lanzar RuntimeError (ver parallel.py).
# MPLBACKEND=Agg     – evita que matplotlib intente abrir una ventana de GUI.

name: CI

on:
  push:
    branches: ["main", "master", "dev", "develop"]
    paths:
      - "version_2/**"
      - "src/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main", "master", "dev", "develop"]
    paths:
      - "version_2/**"
      - "src/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:          # permite disparar manualmente desde la UI

permissions:
  contents: read

# Cancela corridas anteriores del mismo PR/branch para ahorrar minutos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Trabajo principal: smoke + pytest + ejemplos
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: "Python ${{ matrix.python-version }} · ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false          # que un OS que falle no cancele el otro
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]



    defaults:
      run:
        # Todos los pasos se ejecutan desde el subdirectorio del paquete.
        working-directory: version_2

    env:
      ALLOW_NO_OPENMP: "1"     # compile_c_target no falla si OpenMP ausente
      MPLBACKEND: "Agg"        # matplotlib sin GUI
      RUN_PUBLISHED_LYAPUNOV: "0"
      RUN_PUBLISHED_CLONED: "0"
      RUN_PUBLISHED_CLONED_ALL: "0"

    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: git config --global core.longpaths true

      # ── 1. Checkout ──────────────────────────────────────────────────────
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: version_2/pyproject.toml

      # ── 3. Instalar paquete en modo editable + dependencias dev ──────────
      - name: Install package (editable + dev and analysis extras)
        run: python -m pip install -e ".[dev,analysis]"

      # ── 4. Verificar sintaxis de todos los módulos Python ────────────────
      - name: Compile-check (syntax smoke)
        run: python -m compileall hidden_attractors examples tests tools/cli

      # ── 5. Pytest para version_2 ─────────────────────────────────────────
      - name: Run pytest for version_2
        run: python -m pytest -q -m "not slow"


      # ── 6. Ejemplos de usuario ───────────────────────────────────────────
      - name: Run quickstart_equilibria example
        run: python examples/quickstart_equilibria.py

      - name: Run list_final_candidates example
        run: python examples/list_final_candidates.py

      # ── 7. Integración de validación fraccionaria y verificación ─────────
      - name: Run EFORK integrator validation
        run: python tools/validation/validate_efork_integrator.py --validation-root ${{ runner.temp }}/ha_validation
        env:
          PYTHONPATH: .

      - name: Check validation contract with pending allowed
        run: hidden-attractors validate contract --validation-root ${{ runner.temp }}/ha_validation --allow-pending

  # ─────────────────────────────────────────────────────────────────────────
  # Trabajo opcional: prueba nativa de backends C (solo si gcc está en PATH)
  # ─────────────────────────────────────────────────────────────────────────
  cc-probe:
    name: "C-backend probe · ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    needs: test                 # sólo si los smoke tests pasan

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: version_2

    env:
      ALLOW_NO_OPENMP: "1"
      MPLBACKEND: "Agg"
      RUN_PUBLISHED_LYAPUNOV: "0"
      RUN_PUBLISHED_CLONED: "0"
      RUN_PUBLISHED_CLONED_ALL: "0"

    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: git config --global core.longpaths true

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: version_2/pyproject.toml

      - name: Install package (editable + dev and analysis extras)
        run: python -m pip install -e ".[dev,analysis]"

      # ── Detectar si gcc/cc está disponible ───────────────────────────────
      - name: Check C compiler availability
        id: cc_check
        shell: bash
        run: |
          if command -v gcc &>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            gcc --version
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              echo "gcc is required for the Linux native hardening gate" >&2
              exit 1
            fi
            echo "::warning::gcc not found – Windows C-backend smoke will be skipped"
          fi

      - name: Strict C11 native hardening gate
        if: matrix.os == 'ubuntu-latest' && steps.cc_check.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          strict_flags=(
            -std=c11 -O1 -Wall -Wextra -Wpedantic -Wconversion
            -Wsign-conversion -Wshadow -Wformat=2 -Wnull-dereference
            -Walloc-zero -Werror
          )
          sources=(
            hidden_attractors/native/csrc/correlation_sum.c
            hidden_attractors/native/csrc/fractional_integrators.c
            hidden_attractors/native/csrc/fractional_variational_lyapunov_lib.c
            hidden_attractors/native/csrc/general_fde_solver.c
            hidden_attractors/native/csrc/grunwald_letnikov_lib.c
            hidden_attractors/native/csrc/permutation_entropy.c
            hidden_attractors/native/csrc/chua_frac_backend_lib.c
            hidden_attractors/native/csrc/chua_abm_full_history_lib.c
            hidden_attractors/native/csrc/chua_basin_lib.c
            hidden_attractors/native/csrc/chua_frac_lyapunov_efork_benettin.c
            hidden_attractors/native/csrc/chua_hidden_backend.c
            hidden_attractors/native/tests/native_sanitizer_harness.c
          )
          for source in "${sources[@]}"; do
            gcc "${strict_flags[@]}" -fsyntax-only "$source"
          done

      - name: ASan and UBSan native ABI gate
        if: matrix.os == 'ubuntu-latest' && steps.cc_check.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sanitizer_flags=(
            -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Wconversion
            -Wsign-conversion -Wshadow -Wformat=2 -Werror
            -fsanitize=address,undefined -fno-omit-frame-pointer
          )
          harness="${RUNNER_TEMP}/hafo-native-sanitizer"
          gcc "${sanitizer_flags[@]}" \
            -I hidden_attractors/native/csrc \
            hidden_attractors/native/tests/native_sanitizer_harness.c \
            hidden_attractors/native/csrc/fractional_integrators.c \
            hidden_attractors/native/csrc/general_fde_solver.c \
            -lm -o "$harness"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            "$harness"

          cli="${RUNNER_TEMP}/hafo-hidden-cli-sanitizer"
          gcc "${sanitizer_flags[@]}" \
            hidden_attractors/native/csrc/chua_hidden_backend.c \
            -lm -o "$cli"
          set +e
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            "$cli" --alpha_chua nan \
            >"${RUNNER_TEMP}/hafo-hidden-cli.stdout" \
            2>"${RUNNER_TEMP}/hafo-hidden-cli.stderr"
          cli_status=$?
          set -e
          if grep -Eq "AddressSanitizer|runtime error:" \
              "${RUNNER_TEMP}/hafo-hidden-cli.stderr"; then
            cat "${RUNNER_TEMP}/hafo-hidden-cli.stderr"
            exit 1
          fi
          if [[ $cli_status -eq 0 ]]; then
            echo "The native CLI accepted a non-finite argument." >&2
            exit 1
          fi

      # ── Probar que FractionalChuaBackend compila y devuelve filas ────────
      - name: Build and smoke-test FractionalChuaBackend
        if: steps.cc_check.outputs.available == 'true'
        shell: bash
        run: |
          python - <<'EOF'
          from hidden_attractors.native.backends import FractionalChuaBackend
          import numpy as np
          backend = FractionalChuaBackend.build()
          traj = backend.integrate_efork3(
              [0.1, 0.0, 0.0], q=0.98, h=0.01, Lm=5.0, t_final=0.5
          )
          assert traj.shape[1] == 4, f"Unexpected shape: {traj.shape}"
          print(f"OK – trajectory shape {traj.shape}, first row: {traj[0]}")
          EOF

      # ── Probar que BasinBackend compila y devuelve equilibrios ───────────
      - name: Build and smoke-test BasinBackend
        if: steps.cc_check.outputs.available == 'true'
        shell: bash
        run: |
          python - <<'EOF'
          from hidden_attractors.native.backends import BasinBackend
          backend = BasinBackend.build()
          eq = backend.equilibria()
          print("Equilibria:", {k: v.tolist() for k, v in eq.items()})
          assert "E0" in eq and "E+" in eq and "E-" in eq
          print("OK")
          EOF

  # ─────────────────────────────────────────────────────────────────────────
  # Trabajo MANUAL (workflow_dispatch) – macOS con libomp de Homebrew
  # No corre en push/PR automático porque brew install libomp es lento e
  # impredecible en runners efímeros.  Documentado como limitación.
  # ─────────────────────────────────────────────────────────────────────────
  ci-macos:
    name: "macOS · Python 3.12 (manual)"
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'

    defaults:
      run:
        working-directory: version_2

    env:
      ALLOW_NO_OPENMP: "1"     # fallback si libomp falla de todas formas
      MPLBACKEND: "Agg"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      RUN_PUBLISHED_LYAPUNOV: "0"
      RUN_PUBLISHED_CLONED: "0"
      RUN_PUBLISHED_CLONED_ALL: "0"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: version_2/pyproject.toml

      # Intentar instalar libomp; si falla, ALLOW_NO_OPENMP=1 hace el fallback.
      - name: Install libomp (best-effort)
        run: brew install libomp || echo "::warning::libomp install failed – falling back to no-OpenMP"

      - name: Install package (editable + dev and analysis extras)
        run: python -m pip install -e ".[dev,analysis]"

      - name: Compile-check (syntax smoke)
        run: python -m compileall hidden_attractors examples tests tools/cli

      - name: Run pytest
        run: python -m pytest -q -m "not slow"

      - name: Run quickstart_equilibria example
        run: python examples/quickstart_equilibria.py

      - name: Run list_final_candidates example
        run: python examples/list_final_candidates.py

      - name: Build and smoke-test FractionalChuaBackend (macOS)
        shell: bash
        run: |
          python - <<'EOF'
          from hidden_attractors.native.backends import FractionalChuaBackend
          import numpy as np
          backend = FractionalChuaBackend.build()
          traj = backend.integrate_efork3(
              [0.1, 0.0, 0.0], q=0.98, h=0.01, Lm=5.0, t_final=0.5
          )
          assert traj.shape[1] == 4
          print(f"OK – shape {traj.shape}")
          EOF
