name: Publish Python Package

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "release/v1.1.0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: version_2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: version_2/pyproject.toml

      - name: Require an authorized version-matched release ref
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          ref = os.environ["GITHUB_REF"]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if ref.startswith("refs/tags/"):
              tag = ref.removeprefix("refs/tags/")
              if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
                  raise SystemExit(f"Invalid release tag: {tag}")
              if tag != f"v{version}":
                  raise SystemExit(
                      f"Tag {tag} does not match package version {version}."
                  )
          elif ref == "refs/heads/release/v1.1.0":
              if version != "1.1.0":
                  raise SystemExit(
                      "The one-time release branch is restricted to version 1.1.0."
                  )
          else:
              raise SystemExit(
                  "Publication requires a version-matched tag or the exact "
                  "release/v1.1.0 branch."
              )
          PY

          if [[ "$GITHUB_REF" == "refs/heads/release/v1.1.0" ]]; then
            git fetch --no-tags --depth=1 origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          fi

      - name: Install package and release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,analysis,docs]"

      - name: Validate release readiness
        run: python tools/release/validate_release_readiness.py --submission-strict

      - name: Run release test suite
        run: python -m pytest -q -m "not slow"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test clean wheel installation
        run: python tools/release/validate_wheel_install.py --use-existing-dist

      - name: Require unchanged tracked files
        working-directory: .
        run: git diff --exit-code

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: hidden-attractors-fo-distributions
          path: version_2/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified artifact to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hidden-attractors-fo
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: hidden-attractors-fo-distributions
          path: version_2/dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: version_2/dist/
