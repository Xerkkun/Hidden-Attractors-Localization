name: Publish Python Package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: version_2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: version_2/pyproject.toml

      - name: Require an exact version-matched tag and commit
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          ref = os.environ["GITHUB_REF"]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if not ref.startswith("refs/tags/"):
              raise SystemExit("Publication requires a version-matched tag.")
          tag = ref.removeprefix("refs/tags/")
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"Invalid release tag: {tag}")
          if tag != f"v{version}":
              raise SystemExit(
                  f"Tag {tag} does not match package version {version}."
              )
          PY

          tag="${GITHUB_REF#refs/tags/}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${tag}^{commit}")" = "$GITHUB_SHA"

      - name: Install package and release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,analysis,docs]"

      - name: Validate release readiness
        run: python tools/release/validate_release_readiness.py --submission-strict

      - name: Run release test suite
        run: python -m pytest -q -m "not slow"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test clean wheel installation
        run: python tools/release/validate_wheel_install.py --use-existing-dist

      - name: Require unchanged tracked files
        working-directory: .
        run: git diff --exit-code

      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hidden-attractors-fo-distributions
          path: version_2/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified artifact to PyPI
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hidden-attractors-fo
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hidden-attractors-fo-distributions
          path: version_2/dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: version_2/dist/
