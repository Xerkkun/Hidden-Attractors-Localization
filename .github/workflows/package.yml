name: Package

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: version_2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: version_2/pyproject.toml
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build package
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Test wheel install
        run: |
          python -m venv /tmp/ha-wheel-test
          /tmp/ha-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/ha-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/ha-wheel-test/bin/hidden-attractors --help
          /tmp/ha-wheel-test/bin/hidden-attractors seed --help
          /tmp/ha-wheel-test/bin/python -c "import hidden_attractors; print('import ok')"
      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hidden-attractors-fo-dist
          path: version_2/dist/*
